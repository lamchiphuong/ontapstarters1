<style>
:root{--bg:#fff7e0;--card:#fff;--ink:#23305a;--muted:#5b6690;--blue:#2f6fed;--green:#1f9d55;--red:#e5484d;--yellow:#ffc933;--line:#23305a;--ok:#d9f6e3;--no:#ffe0e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a2140;--card:#252e57;--ink:#f3f5ff;--muted:#b4bce0;--line:#f3f5ff;--ok:#1d5a3a;--no:#6a2a30}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Fredoka","Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.35}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{padding:18px 16px 8px;text-align:center}
h1{margin:0;font-size:clamp(24px,6vw,38px);letter-spacing:.5px}
h1 span{display:inline-block;background:var(--yellow);color:#23305a;padding:0 12px;border-radius:14px;transform:rotate(-2deg)}
.sub{color:var(--muted);margin:6px 0 0}
.name{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px auto 0;flex-wrap:wrap}
.name input{font:inherit;padding:8px 14px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(260px,70vw)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;gap:8px;justify-content:center;padding:10px 8px;flex-wrap:wrap}
nav button{font:inherit;font-weight:700;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:8px 14px;cursor:pointer;min-width:84px}
nav button[aria-selected=true]{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--line)}
nav button .st{display:block;font-size:14px;font-weight:600}
main{max-width:780px;margin:0 auto;padding:6px 14px 40px}
.part{display:none}.part.on{display:block}
.part>h2{margin:8px 0 2px;font-size:26px}
.how{margin:0 0 14px;color:var(--muted)}
.q{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;margin:14px 0;display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;box-shadow:0 5px 0 var(--line)}
.q.ex{border-style:dashed;box-shadow:none}
.q.right{background:var(--ok)}.q.wrong{background:var(--no)}
.q img{width:100%;max-height:150px;object-fit:contain;border-radius:12px;background:#fff}
.q.nopic{grid-template-columns:1fr}
.tag{display:inline-block;background:var(--yellow);color:#23305a;font-weight:800;border-radius:999px;padding:1px 12px;font-size:15px;margin-bottom:4px}
.say{font-size:22px;font-weight:700;margin:0 0 8px}
.say button,.spk{font:inherit;border:0;background:none;cursor:pointer;font-size:22px;padding:0 4px}
.tf{display:flex;gap:12px}
.tf button{font:inherit;font-size:30px;width:70px;height:56px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tf button.y:hover{background:var(--ok)}.tf button.n:hover{background:var(--no)}
.tf button.pick{background:var(--blue);color:#fff}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;cursor:pointer;font-size:19px}
.opt b{display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;background:var(--yellow);color:#23305a;margin-right:8px}
.opt.good{background:var(--ok);border-color:var(--green)}.opt.bad{background:var(--no);border-color:var(--red)}
.dlg p{margin:2px 0 8px;font-size:20px}.dlg .who{font-weight:800;color:var(--blue)}
.slots,.pool{display:flex;gap:8px;flex-wrap:wrap;min-height:54px;align-items:center}
.slots{border-bottom:4px dashed var(--muted);padding-bottom:6px;margin-bottom:10px}
.tile{font:inherit;font-weight:800;font-size:24px;min-width:48px;padding:6px 12px;border:3px solid var(--line);border-radius:14px;background:var(--yellow);color:#23305a;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tile.used{visibility:hidden}
.tile.in{background:var(--card);color:var(--ink)}
.q.right .tile.in{background:#fff;color:#14532d}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.small{font:inherit;font-size:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:4px 12px;cursor:pointer}
.msg{min-height:26px;font-weight:700;margin-top:4px}
.right .msg{color:#14532d}.wrong .msg{color:#a3262b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .right .msg{color:#9df0bf}:root:not([data-theme="light"]) .wrong .msg{color:#ffb3b6}:root:not([data-theme="light"]) .q.right .tile.in{background:#14532d;color:#fff}}
.hint{font-size:15px;color:var(--muted)}
.done{display:none;text-align:center;padding:18px;border:4px solid var(--line);border-radius:24px;background:var(--yellow);color:#23305a;margin:20px 0}
.done.show{display:block}
.done .big{font-size:34px;font-weight:800}
.finish{max-width:780px;margin:0 auto;padding:0 14px 40px}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.04)}}
@media (max-width:520px){.q{grid-template-columns:110px 1fr;padding:10px}.say{font-size:19px}.tile{font-size:21px}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
button:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
</style></head><body>

const ST={1:[],2:[],3:[],4:[]}; // true/false per question
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim();
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const spk=t=>{const b=el('button','spk','🔊');b.setAttribute('aria-label','Listen');b.onclick=()=>speak(t);return b};

function mark(card,ok,part,i,msgOk,msgNo){
  card.classList.remove('right','wrong');card.classList.add(ok?'right':'wrong','pop');
  $('.msg',card).textContent=ok?('⭐ '+msgOk):msgNo;
  if(ST[part][i]!==true)ST[part][i]=ok; refresh();
}

   mark(c,v===q.a,1,i,'Great job!','Oops! Thử lại nhé 🙂')};

  let cur=[];const letters=q.w.split('');
  let order;do{order=shuf(letters.map((_,k)=>k))}while(letters.length>2&&order.every((v,k)=>v===k));
  const tiles=order.map(k=>{const b=el('button','tile',letters[k]);b.onclick=()=>add(b,letters[k]);pool.appendChild(b);return b});
  function add(b,l){if(c.classList.contains('right')||q.ex&&cur.length>=letters.length)return;b.classList.add('used');cur.push({b,l});draw();
   if(cur.length===letters.length){const w=cur.map(x=>x.l).join('');
    if(w===q.w){if(q.ex)$('.msg',c).textContent='⭐ marker';else mark(c,true,2,i,'Perfect! '+q.w+' ✔','');}
    else{$('.msg',c).textContent='Chưa đúng, thử lại nhé!';if(!q.ex)ST[2][i]=ST[2][i]===true?true:false;c.classList.add('wrong');}}}
  function draw(){slots.innerHTML='';cur.forEach(x=>{const t=el('button','tile in',x.l);t.onclick=()=>{if(c.classList.contains('right'))return;x.b.classList.remove('used');cur=cur.filter(y=>y!==x);c.classList.remove('wrong');$('.msg',c).textContent='';draw()};slots.appendChild(t)});
   if(!cur.length)slots.appendChild(el('span','hint','Bấm chữ cái bên dưới ↓'))}
  draw();
  const clr=el('button','small','↺ Làm lại');clr.onclick=()=>{cur.forEach(x=>x.b.classList.remove('used'));cur=[];c.classList.remove('wrong','right');$('.msg',c).textContent='';draw()};
  const row=el('div','row');row.append(clr,spk(q.w));
  r.append(slots,pool,row,el('div','msg'));c.appendChild(r);root.appendChild(c);
  if(q.ex){q.w.split('').forEach((_,k)=>{});setTimeout(()=>{},0)}
 })}

const P3=[
 {ex:1,b:'What’s your name?',o:['Stand.','I’m a girl.','Hello. I’m Emma.'],a:2,g:'Hi. What’s your name?'},
 {b:'What is it?',o:['I have a ball.','It’s a sandwich.','I like sandwiches.'],a:1},

 {b:'I’m sorry.',o:['That’s OK.','Thank you.','OK, let’s skip.'],a:0},
 {b:'Thank you.',o:['I’m OK.','Oops.','You’re welcome.'],a:2}];
function buildP3(root){let qi=-1;
 P3.forEach(q=>{const i=q.ex?-1:++qi;const c=el('div','q nopic'+(q.ex?' ex':''));

    else{b.classList.add('bad');$('.msg',c).textContent='Chưa đúng, chọn lại nhé!';if(!q.ex&&ST[3][i]!==true){ST[3][i]=false;refresh()}}};
   o.appendChild(b)});

// PART 4
const P4=[
 {ex:1,img:'boy',q:'What’s your name?',a:['I’m Danny.'],pool:['I’m','Danny.'],mode:'ans'},
 {img:'beans',q:'Do you like beans?',a:['Yes, I do.'],pool:['Yes,','I','do.'],mode:'ans'},
 {img:'run',q:'What can you do?',a:['I can run.'],pool:['I','can','run.'],mode:'ans'},
 {img:'clap',q:'Can you clap your hands?',a:['Yes, I can.'],pool:['Yes,','I','can.'],mode:'ans'},
 {img:'mouth',q:'I can touch my mouth.',a:['What can you do?'],pool:['What','can','you','do?'],mode:'ques'},
 {img:'fish',q:'Yes, I do.',a:['Do you like fish?'],pool:['Do','you','like','fish?'],mode:'ques'},
 {img:'sing',q:'No, I can’t.',a:['Can you sing?'],pool:['Can','you','sing?'],mode:'ques'}];
function buildP4(root){let qi=-1;
 P4.forEach(q=>{const i=q.ex?-1:++qi;const c=el('div','q'+(q.ex?' ex':''));
  c.appendChild(el('img')).src=IMG[q.img];c.lastChild.alt='';
  const r=el('div');r.appendChild(el('span','tag',q.ex?'Example':'Question '+(i+1)));
  const p=el('p','say');
  if(q.mode==='ans'){p.append(q.q+' ');p.appendChild(spk(q.q));r.appendChild(p);r.appendChild(el('p','hint','Trả lời câu hỏi (answer):'))}
  else{p.append('“'+q.q+'” ');p.appendChild(spk(q.q));r.appendChild(p);r.appendChild(el('p','hint','Viết câu hỏi (write the question):'))}
  const slots=el('div','slots'),pool=el('div','pool');let cur=[];
  const tiles=shuf(q.pool).map(w=>{const b=el('button','tile',w);b.onclick=()=>add(b,w);pool.appendChild(b);return b});
  function add(b,w){if(c.classList.contains('right'))return;b.classList.add('used');cur.push({b,w});draw();check()}
  function check(){const s=norm(cur.map(x=>x.w).join(' '));
   if(q.a.some(a=>norm(a)===s)){if(q.ex)$('.msg',c).textContent='✔ Đúng rồi!';else mark(c,true,4,i,'Awesome! '+cur.map(x=>x.w).join(' '),'')}
   else if(cur.length>=Math.max(...q.a.map(a=>a.split(' ').length))){$('.msg',c).textContent='Chưa đúng, thử lại nhé!';if(!q.ex&&ST[4][i]!==true){ST[4][i]=false;refresh()}}else $('.msg',c).textContent=''}
  function draw(){slots.innerHTML='';cur.forEach(x=>{const t=el('button','tile in',x.w);t.onclick=()=>{if(c.classList.contains('right'))return;x.b.classList.remove('used');cur=cur.filter(y=>y!==x);$('.msg',c).textContent='';draw()};slots.appendChild(t)});
   if(!cur.length)slots.appendChild(el('span','hint','Bấm các từ bên dưới ↓'))}
  draw();
  const clr=el('button','small','↺ Làm lại');clr.onclick=()=>{cur.forEach(x=>x.b.classList.remove('used'));cur=[];c.classList.remove('wrong','right');$('.msg',c).textContent='';draw()};
  const row=el('div','row');row.appendChild(clr);
  r.append(slots,pool,row,el('div','msg'));c.appendChild(r);root.appendChild(c)})}

const main=$('#main'),nav=$('#nav'),B=[buildP1,buildP2,buildP3,buildP4];
PARTS.forEach((p,k)=>{const n=k+1;
 const s=el('section','part'+(k?'':' on'));s.id='p'+n;
 s.appendChild(el('h2',null,`Part ${n}: ${p.t}`));s.appendChild(el('p','how',p.v));B[k](s);
 const nx=el('div','row');const b=el('button','small',n<4?`Part ${n+1} ➜`:'Xem kết quả 🏆');b.onclick=()=>n<4?go(n):$('#done').scrollIntoView({behavior:'smooth'});nx.appendChild(b);s.appendChild(nx);
 main.appendChild(s);
 const t=el('button',null,`Part ${n}<span class="st" id="st${n}">0/${p.n}</span>`);t.setAttribute('role','tab');t.setAttribute('aria-selected',k===0);t.onclick=()=>go(k);nav.appendChild(t)});
function go(k){document.querySelectorAll('.part').forEach((s,i)=>s.classList.toggle('on',i===k));[...nav.children].forEach((b,i)=>b.setAttribute('aria-selected',i===k));window.scrollTo({top:0,behavior:'smooth'})}
function refresh(){let tot=0,all=0;
 for(let n=1;n<=4;n++){const sc=ST[n].filter(v=>v===true).length;tot+=sc;all+=PARTS[n-1].n;$('#st'+n).textContent=(sc===PARTS[n-1].n?'⭐ ':'')+sc+'/'+PARTS[n-1].n}
 const d=$('#done');const nm=$('#nm').value.trim()||'bạn nhỏ';
 if(tot===all){d.className='done show';d.innerHTML=`<div class="big">🎉 Well done, ${nm.replace(/</g,'&lt;')}! 🎉</div><p>Bé đã trả lời đúng ${tot}/${all} câu!</p><button class="small" onclick="location.reload()">Chơi lại ↺</button>`;speak('Well done!')}
 else{d.className='done show';d.innerHTML=`<div class="big">⭐ ${tot} / ${all}</div><p>Bé đã làm đúng ${tot} câu. Cố lên nhé!</p>`}}
refresh();
